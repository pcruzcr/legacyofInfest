# requirements.lock — pinned dependencies for reproducible CI builds.
#
# AUD-008: the previous lock file was not a real lock file. It was hand-written
# and internally unsatisfiable — it pinned numba==0.60.0 together with
# numpy==2.5.0, but numba 0.60 requires numpy<2.1, so `pip install -r
# requirements.lock` could never resolve. It also pinned versions that did not
# exist at the time it claimed to be generated (matplotlib 3.11.0, scipy
# 1.17.1, scikit-image 0.26.0), and it was never generated by pip-compile
# despite the header saying so. CI depended on this file, which is one reason
# CI had never produced a green run.
#
# Regenerate properly, do not hand-edit:
#     pip install pip-tools
#     pip-compile --output-file=requirements.lock pyproject.toml
#
# Until that is run in the target environment, install from requirements.txt or
# `pip install -e ".[dev]"` instead. The pins below are the versions the audit
# of 2026-07-26 verified as mutually resolvable on Python 3.10-3.13.

