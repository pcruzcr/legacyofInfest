# requirements.lock — pines reproducibles para el CI.
#
# NO SE EDITA A MANO. Se regenera con la orden que aparece justo debajo, y esa
# regla tiene historia: AUD-008 encontró aquí un lock escrito a mano e
# **internamente irresoluble** —fijaba numba 0.60 con numpy 2.5.0, y numba 0.60
# exige numpy<2.1— con versiones que no existían el día que decía haberse
# generado. El CI dependía de este fichero, y es una de las razones por las que
# nunca había tenido una ejecución verde.
#
# AUD-262 (2026-08-04) — GAP-022 cerrado, y la razón por la que había durado
# tanto tiene nombre: `pip-compile` ata el lock **al intérprete que lo ejecuta**,
# y la única máquina disponible corre Python 3.14, fuera de la matriz del CI
# (3.11/3.12/3.13). Regenerarlo con pip-tools desde 3.14 habría cambiado un lock
# imposible en 3.13 por otro imposible en 3.11: por eso AUD-173 y la iteración 4
# lo dejaron sin tocar, y acertaron.
#
# `uv pip compile --python-version 3.11 --universal` resuelve **para** una
# versión objetivo sin necesitar ese intérprete, y emite marcadores de entorno
# en vez de un pin único, así que un solo fichero sirve para las tres versiones
# de la matriz. Eso es lo que desbloquea el hueco.
#
# Los dos pines caducos que motivaban GAP-022 desaparecen:
#
#   * `numpy==1.26.4` → 2.4.6 en <3.12 y 2.5.1 en >=3.12. La 1.26.4 es la última
#     1.x y sus ruedas llegan hasta 3.12: en 3.13 no existía ninguna, así que el
#     fichero **no se podía instalar** en el intérprete más nuevo del CI.
#   * `Pillow==12.2.0` → 12.3.0, el mínimo que AUD-176 fijó tras dejar la 12.2.0
#     fuera del rango soportado por acumular diez vulnerabilidades publicadas.
#
# Alcance: sólo dependencias de ejecución, como el fichero anterior. Las de
# desarrollo llegan por `pip install -e ".[dev]"`, que es lo que instala el CI.
