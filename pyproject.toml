[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "legacyofinfest"
version = "1.0.0"
description = "Educational game engine for Computer Graphics, Image Processing, and Pattern Recognition"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "Pillow>=12.2",
    "pytmx>=3.32",
    "pyscroll>=2.31",
    "pytweening>=1.2",
    "joblib>=1.4",
    "matplotlib>=3.9",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
no_strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_any_unimported = false
warn_return_any = false
warn_unused_ignores = false
