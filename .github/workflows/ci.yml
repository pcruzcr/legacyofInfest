name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/ scripts/ --output-format=github

      - name: Validate assets
        run: |
          python scripts/validate_assets.py

      - name: Validate TMX maps
        run: |
          python scripts/validate_tmx.py --ci

      - name: Grade reference stage
        run: |
          python scripts/grade_stage.py assets/maps/ --json

      - name: Grade reference boss
        run: |
          python scripts/grade_boss.py src/framework/entities/boss_base.py --json

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=report.xml --cov=src --cov-report=xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run grade_stage
        run: |
          python scripts/grade_stage.py assets/maps/ --json

      - name: Run validate_tmx
        run: |
          python scripts/validate_tmx.py --ci

      - name: Run grade_boss on stages
        run: |
          python scripts/grade_boss.py src/stages/ --json
