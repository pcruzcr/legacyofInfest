# AUD-125 — actualizaciones de dependencias vigiladas
#
# `pip-audit` en el CI avisa de un CVE **cuando alguien empuja código**. Si
# nadie toca el repositorio en agosto, nadie se entera hasta septiembre.
# Dependabot mira todas las semanas aunque el repositorio esté quieto, que es
# justo el caso de un proyecto docente entre semestres.
#
# Se limita a cinco PR abiertos a la vez a propósito: veinte PR de
# dependencias que nadie revisa son ruido, y el ruido enseña a ignorar la
# pestaña donde también aparecen los avisos que importan.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencias"
    commit-message:
      prefix: "deps"
    groups:
      # Las de seguridad van juntas y aparte: son las que hay que mirar hoy.
      seguridad:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "ci"
